<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión | Loopstock</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
  <main class="auth-page">

    <section class="card auth-card" aria-labelledby="login-title">

      <header class="auth-header">
        <span class="brand-name auth-brand">▦ LOOPSTOCK</span>
        <h1 id="login-title">Iniciar sesión</h1>
        <p>Accede al sistema de gestión de inventario.</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <p
          id="login-message"
          class="auth-message"
          role="alert"
          aria-live="assertive"
        ></p>

        <button type="submit" id="login-button" class="btn btn-primary auth-submit">
          Iniciar sesión
        </button>

      </form>

    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="../js/theme.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
