components:
  schemas:
    UsuarioEntrada:
      type: object
      description: Solo se aceptan estos campos; el resto (_id, active, fechas) se ignora.
      properties:
        name: { type: string, minLength: 2, maxLength: 60, example: Empleado Demo }
        email: { type: string, format: email, description: "Único; se guarda en minúsculas", example: empleado@loopstock.com }
        password: { type: string, format: password, minLength: 8, description: "Se guarda cifrada con bcrypt; nunca se devuelve", example: empleado123 }
        role: { type: string, enum: [admin, empleado], default: empleado }
    Usuario:
      type: object
      properties:
        _id: { type: string, example: 6ae27182746d62a561e203c4 }
        name: { type: string, example: Empleado Demo }
        email: { type: string, example: empleado@loopstock.com }
        role: { type: string, enum: [admin, empleado], example: empleado }
        active: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

paths:
  /api/users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (solo admin)
      description: Ordenados por nombre. Nunca incluye la contraseña.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          description: Filtra por rol
          schema: { type: string, enum: [admin, empleado] }
        - name: active
          in: query
          description: Filtra por estado
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Usuario" }
        "400":
          description: Rol no válido en el filtro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Rol no válido. Valores permitidos: admin, empleado" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Usuarios]
      summary: Crear usuario (solo admin)
      description: Si no se envía `role`, se crea como `empleado`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UsuarioEntrada"
                - required: [name, email, password]
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400":
          description: Datos no válidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Ya existe un usuario con ese email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDuplicado" }

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdMongo"
    delete:
      tags: [Usuarios]
      summary: Desactivar usuario (solo admin)
      description: Baja lógica (`active = false`); el usuario ya no puede hacer login. Un admin no puede desactivarse a sí mismo.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario desactivado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: Usuario desactivado correctamente }
                  usuario: { $ref: "#/components/schemas/Usuario" }
        "400":
          description: Id no válido o intento de desactivarse a sí mismo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "No puedes desactivar tu propio usuario" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
