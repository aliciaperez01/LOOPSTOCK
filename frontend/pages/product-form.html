
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto | Loopstock</title>
  <link rel="stylesheet" href="../css/styles.css">
  
</head>

<body>
  <div class="app-layout">

    <aside class="sidebar">
      <a href="dashboard.html" class="brand">
        <span class="brand-name">▦ LOOPSTOCK</span>
      </a>

      <p class="nav-label">Menú principal</p>

      <nav>
        <a href="dashboard.html" class="nav-link">▦ Dashboard</a>
        <a href="products.html" class="nav-link active">▣ Productos</a>
        <a href="suppliers.html" class="nav-link">▤ Proveedores</a>
        <a href="movements.html" class="nav-link">⇄ Movimientos</a>
        <a href="imports.html" class="nav-link">⇧ Importaciones</a>
      </nav>

      <p class="nav-label">Sistema</p>
      <a href="login.html" class="nav-link">↪ Cerrar sesión</a>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <strong>Gestión de inventario</strong>

        <button type="button" class="btn btn-secondary" id="theme-toggle">
          🌙 Modo oscuro
        </button>
      </header>

      <section class="page-content">

        <div class="page-header">
          <div>
            <h1>Nuevo producto</h1>
            <p class="page-description">
              Introduce los datos del producto que quieres registrar.
            </p>
          </div>

          <a href="products.html" class="btn btn-secondary">
            ← Volver a productos
          </a>
        </div>

        <section class="card">
          <form id="product-form">

            <div class="form-grid">

              <div class="form-group">
                <label for="name">Nombre del producto *</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Ej. Micrófono de estudio"
                  required
                >
              </div>

              <div class="form-group">
                <label for="sku">SKU *</label>
                <input
                  type="text"
                  id="sku"
                  name="sku"
                  placeholder="Ej. MIC-001"
                  required
                >
              </div>

              <div class="form-group">
                <label for="category">Categoría *</label>
                <input
                  type="text"
                  id="category"
                  name="category"
                  placeholder="Ej. Audio"
                  required
                >
              </div>

              <div class="form-group">
                <label for="supplier">Proveedor *</label>
                <input
                  type="text"
                  id="supplier"
                  name="supplier"
                  placeholder="Nombre del proveedor"
                  required
                >
              </div>

              <div class="form-group">
                <label for="quantity">Cantidad inicial *</label>
                <input
                  type="number"
                  id="quantity"
                  name="quantity"
                  min="0"
                  step="1"
                  value="0"
                  required
                >
              </div>

              <div class="form-group">
                <label for="minStock">Stock mínimo *</label>
                <input
                  type="number"
                  id="minStock"
                  name="minStock"
                  min="0"
                  step="1"
                  value="2"
                  required
                >
              </div>

              <div class="form-group">
                <label for="price">Precio (€) *</label>
                <input
                  type="number"
                  id="price"
                  name="price"
                  min="0"
                  step="0.01"
                  placeholder="0.00"
                  required
                >
              </div>

            </div>

            <p id="form-message" role="status"></p>

            <div class="form-actions">
              <a href="products.html" class="btn btn-secondary">
                Cancelar
              </a>

              <button type="submit" class="btn btn-primary" id="save-button">
                Guardar producto
              </button>
            </div>

          </form>
        </section>

      </section>
    </main>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/product-form.js"></script>
</body>
</html>
