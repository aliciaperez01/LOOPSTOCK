    const button = document.getElementById("load-button");
    const status = document.getElementById("status");
    const summary = document.getElementById("summary");
    const results = document.getElementById("results");

    function addResult(message) {
      const item = document.createElement("li");
      item.textContent = message;
      results.appendChild(item);
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      results.replaceChildren();
      summary.textContent = "";
      status.textContent = "Consultando la API...";

      let added = 0;
      let skipped = 0;
      let failed = 0;

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("Error consultando la API: HTTP " + response.status);
        }

        const existingProducts = await response.json();

        if (!Array.isArray(existingProducts)) {
          throw new Error("La API no ha devuelto una lista de productos.");
        }

        const existingSkus = new Set(
          existingProducts.map(product => product.sku)
        );

        for (const product of products) {
          if (existingSkus.has(product.sku)) {
            skipped++;
            addResult("Ya existía; no se modifica: " + product.name);
            continue;
          }

          try {
            const createResponse = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(product)
            });

            if (!createResponse.ok) {
              const errorText = await createResponse.text();
              throw new Error(
                "HTTP " + createResponse.status + ": " + errorText
              );
            }

            added++;
            existingSkus.add(product.sku);
            addResult("Añadido: " + product.name);
          } catch (error) {
            failed++;
            addResult("Error al añadir " + product.name + ": " + error.message);
          }

          status.textContent =
            "Procesando catálogo... " +
            (added + skipped + failed) + " de " + products.length;
        }

        status.textContent = "Proceso terminado.";
        summary.textContent =
          "Referencias del catálogo: " + products.length +
          " | Añadidas: " + added +
          " | Ya existentes: " + skipped +
          " | Errores: " + failed;

      } catch (error) {
        status.textContent = "No se pudo cargar el catálogo.";
        summary.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
